<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranger Things Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('stranger.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }
    /* Parlak ışık efekti animasyonunu gpt ile birlikte yaptık.*/
    @keyframes increaseLight {
      0% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
      50% { box-shadow: 0 0 150px rgba(255, 255, 255, 1); }
      100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
    }
    /* Pusula animasyonunu gpt ile birlikte yaptık.*/
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .login-container {
      width: 220px;
      padding: 20px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid red;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      z-index: 1;
    }
    /* Pusuladaki ayarları GPT ile birlikte yaptık.*/
    .compass {
      position: relative;
      width: 30px;
      height: 40px;
      top: -40px;
      margin: 0 auto 15px;
      animation: rotate 4s linear infinite;
    }

    .north, .south {
      width: 0;
      height: 0;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .north {
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 20px solid black;
      top: 0;
    }

    .south {
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 20px solid red;
      top: 20px;
    }
    /* Motorumun farlarındaki konum ayarlamalarını GPT ile birlikte yaptık.*/
    .parlak-dolunay {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      z-index: 0;
      transition: box-shadow 0.5s ease-in-out;
      animation: increaseLight 3s infinite;
    }

    .parlak-dolunay-1 { bottom: -28%; left: 124%; }
    .parlak-dolunay-2 { bottom: -28%; left: -12%; }
    .parlak-dolunay-3 { bottom: -24%; left: 48%; }

    input {
      display: block;
      width: 93%;
      margin: 10px 0;
      padding: 8px;
      border: none;
      border-bottom: 2px solid red;
      background: transparent;
      color: white;
      font-size: 16px;
      text-align: center;
    }

    input:focus {
      outline: none;
      background-color: rgba(140, 33, 33, 0.3);
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 8px;
      width: 100%;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: rgb(98, 13, 13);
    }

    .clock {
      margin-top: 15px;
      font-size: 18px;
      font-family: 'Arial', sans-serif;
      color: white;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="compass">
      <div class="north"></div>
      <div class="south"></div>
    </div>
    <h2>Stranger Things Login</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button id="login-btn">Login
      <div class="parlak-dolunay parlak-dolunay-1"></div>
      <div class="parlak-dolunay parlak-dolunay-2"></div>
      <div class="parlak-dolunay parlak-dolunay-3"></div>
    </button>
    <div class="clock" id="clock"></div>
  </div>

  <script>
    const loginData = [];
    document.getElementById("login-btn").addEventListener("click", function() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      // username ve password'un aynı olduğu durumda başka bir websiteye geçiş yapmasından GPT'den yardım aldım.
      if (username === "admin" && password === "admin") {
        loginData.push({ username, password });
        console.log("Girişler:", loginData);
        window.location.href = "table.html";
      } else {
        console.log("Lütfen kullanıcı adı ve şifre girin!");
      }
    });
    // updateClock fonksiyonunun mantığını anlamak için GPT'den yardım aldım.
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const timeString = `${hours}:${minutes}:${seconds}`;
      document.getElementById("clock").textContent = timeString;
    }

    setInterval(updateClock, 1000);
    updateClock(); 
    document.addEventListener("keydown", function(event) {
  if (event.key.toLowerCase() === "h") {
    const loginContainer = document.querySelector(".login-container");

    if (loginContainer) {
      loginContainer.style.display = (loginContainer.style.display === "none") ? "block" : "none";
    }
  }
});
  </script>
</body>
</html>
